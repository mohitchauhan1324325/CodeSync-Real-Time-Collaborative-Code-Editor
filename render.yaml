# Render Deployment Configuration
# Docs: https://render.com/docs/render-yaml

services:
  # ── Backend API (Express + Socket.io) ────────────────────────
  - type: web
    name: codesync-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false           # Set this manually in the Render dashboard
      - key: JWT_SECRET
        generateValue: true   # Auto-generated by Render
      - key: CLIENT_URL
        sync: false           # Set to your Vercel frontend URL
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_URL
        value: https://judge0-ce.p.rapidapi.com
